name: Build Windows release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install application and build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-build.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Determine version
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}".TrimStart("v")
          } else {
            python -c "from backend import __version__; print(__version__)"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build and test release
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version $env:APP_VERSION -SkipDependencyInstall

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEMO-Deficiencies-${{ env.APP_VERSION }}
          path: release/*

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/* `
            --title "NEMO Deficiencies ${{ github.ref_name }}" `
            --generate-notes
