[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nemo-deficiencies"
dynamic = ["version"]
description = "Local web application for editing NEMO deficiency reports"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "mtemmers" },
]
keywords = ["nemo", "data-quality", "hana", "reports"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "cryptography>=42",
  "requests>=2.32",
  "nemo_library==1.6.63",
  "pandas",
]

[project.urls]
Homepage = "https://github.com/mtemmers/nemo_deficiencies"
Repository = "https://github.com/mtemmers/nemo_deficiencies.git"
Issues = "https://github.com/mtemmers/nemo_deficiencies/issues"

[project.scripts]
nemo-deficiencies = "backend.cli:main"

[tool.setuptools.dynamic]
version = { attr = "backend.__version__" }

[tool.setuptools.packages.find]
include = ["backend", "backend.*"]

[tool.setuptools.package-data]
backend = ["frontend/*.html", "frontend/*.css", "frontend/*.js"]
